name: Godot checks and Android ARM64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install matching Godot tools
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fLsS "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot.zip
          curl -fLsS "$base/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          curl -fLsS "$base/SHA512-SUMS.txt" -o sums.txt
          mv godot.zip Godot_v4.7.2-stable_linux.x86_64.zip
          mv templates.tpz Godot_v4.7.2-stable_export_templates.tpz
          grep -E 'Godot_v4.7.2-stable_(linux.x86_64.zip|export_templates.tpz)$' sums.txt | sha512sum -c
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q Godot_v4.7.2-stable_export_templates.tpz templates/android_debug.apk templates/android_release.apk -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          rm Godot_v4.7.2-stable_linux.x86_64.zip Godot_v4.7.2-stable_export_templates.tpz sums.txt
      - name: Prepare Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.1
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and configure export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug' -keyalg RSA -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
      - name: Import and test
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --quit
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/combat_test.gd
      - name: Export development APK
        run: |
          mkdir -p build/android
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug 'Android ARM64'
          python3 tools/verify_apk.py build/android/ultimate-warriors-0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/android/ultimate-warriors-0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 build/android/ultimate-warriors-0.1.0-arm64.apk
          cd build/android && sha256sum ultimate-warriors-0.1.0-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-warriors-arm64-development
          path: build/android/
          retention-days: 14
